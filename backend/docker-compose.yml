x-app-environment: &app-environment
  DJANGO_ENV: production
  DJANGO_SETTINGS_MODULE: lms.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in Dokploy}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in Dokploy}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}@redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in Dokploy}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in Dokploy}
  AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:?Set AUTHENTIK_ISSUER_URL in Dokploy}
  AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?Set AUTHENTIK_CLIENT_ID in Dokploy}
  AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?Set AUTHENTIK_CLIENT_SECRET in Dokploy}
  AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?Set AUTHENTIK_REDIRECT_URI in Dokploy}
  AUTHENTIK_SCOPES: ${AUTHENTIK_SCOPES:-openid profile email}
  OIDC_LOGIN_REDIRECT_URL: ${OIDC_LOGIN_REDIRECT_URL:?Set OIDC_LOGIN_REDIRECT_URL in Dokploy}
  PORTAL_API_BASE_URL: ${PORTAL_API_BASE_URL:-https://odelportal.nsuk.edu.ng/api}
  PORTAL_SYNC_BASE_URL: ${PORTAL_SYNC_BASE_URL:-https://odelportal.nsuk.edu.ng}
  PORTAL_SYNC_PUBLIC_KEY: ${PORTAL_SYNC_PUBLIC_KEY:?Set PORTAL_SYNC_PUBLIC_KEY in Dokploy}
  PORTAL_SYNC_PRIVATE_KEY: ${PORTAL_SYNC_PRIVATE_KEY:?Set PORTAL_SYNC_PRIVATE_KEY in Dokploy}
  PORTAL_JWT_PUBLIC_KEY: ${PORTAL_JWT_PUBLIC_KEY:-}
  PORTAL_JWT_ISSUER: ${PORTAL_JWT_ISSUER:-portal.nsuk.edu.ng}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-1}
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - dokploy-network
      - lms_internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A lms worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
    volumes:
      - media_data:/app/media
    networks:
      - lms_internal
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A lms beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
    networks:
      - lms_internal
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  media_data:
  static_data:

networks:
  dokploy-network:
    external: true
  lms_internal:
    driver: bridge
