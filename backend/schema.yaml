        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faculty'
          description: ''
  /api/notifications/in-app/:
    get:
      operationId: api_notifications_in_app_list
      description: Retrieve all in-app notifications for the authenticated user, optionally
        filtered by read status.
      summary: List user notifications
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
        description: Filter notifications by read status (true/false).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Notifications - In-App
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInAppNotificationList'
          description: ''
  /api/notifications/in-app/{id}/:
    get:
      operationId: api_notifications_in_app_retrieve
      description: Retrieve detailed info for a specific in-app notification by UUID.
      summary: Get single notification
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this In-App Notification.
        required: true
      tags:
      - Notifications - In-App
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InAppNotification'
          description: ''
  /api/notifications/in-app/{id}/mark-read/:
    post:
