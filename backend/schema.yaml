      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Admin - Storage Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStorageSettingsList'
          description: ''
    post:
      operationId: api_content_storage_settings_create
      description: List, create, or upsert storage settings.
      tags:
      - Admin - Storage Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
    put:
      operationId: api_content_storage_settings_update
      description: Update a storage backend selected by its natural ``backend`` key.
      summary: Create or update storage settings
      tags:
      - Admin - Storage Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
  /api/content/storage-settings/{id}/:
    get:
      operationId: api_content_storage_settings_retrieve
      description: Manage specific storage settings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Storage Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
    put:
      operationId: api_content_storage_settings_update_2
      description: Manage specific storage settings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Storage Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StorageSettingsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
    patch:
      operationId: api_content_storage_settings_partial_update
      description: Manage specific storage settings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Storage Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStorageSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStorageSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStorageSettingsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
    delete:
      operationId: api_content_storage_settings_destroy
      description: Manage specific storage settings.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin - Storage Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/content/storage-settings/active/:
    get:
      operationId: api_content_storage_settings_active_retrieve
      description: Get active storage settings.
      summary: Get active storage backend
      tags:
      - Admin - Storage Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageSettings'
          description: ''
  /api/content/storage-settings/backends/:
    get:
      operationId: api_content_storage_settings_backends_retrieve
      description: Get list of available storage backends.
      summary: List available storage backends
      tags:
      - Admin - Storage Settings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: List of available backends
  /api/content/upload/:
    post:
      operationId: api_content_upload_create
      description: Upload any file including videos (MP4, AVI, MOV), PDFs, documents,
        etc.
      summary: Upload learning content file
      tags:
      - Staff - Content Upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LearningContentUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LearningContentUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningContent'
          description: ''
  /api/courses/:
    get:
      operationId: api_courses_list
      description: Retrieve a list of all courses cached from the student portal
      summary: List all courses
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Global - Courses
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseCacheList'
          description: ''
  /api/courses/{id}/:
    get:
      operationId: api_courses_retrieve
      description: Retrieve detailed information about a specific course
      summary: Get course details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course cache.
        required: true
      tags:
      - Global - Courses
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCache'
          description: ''
  /api/dashboard/instructors/:
    get:
      operationId: get_instructor_dashboard
      description: Returns a summary of the instructor's dashboard including courses,
        assignments, and quizzes.
      summary: Instructor Dashboard Summary
      parameters:
      - in: query
        name: programme_type_code
        schema:
          type: string
        description: Programme type code, for example UG (required)
        required: true
      - in: query
        name: semester
        schema:
          type: string
        description: Semester, for example First Semester (required)
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: Academic session, for example 2025/2026 (required)
        required: true
      tags:
      - Staff - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Dashboard summary data
  /api/dashboard/instructors/{external_id}/:
    get:
      operationId: get_instructor_detail_dashboard
      description: |-
        Endpoint for retrieving a specific instructor's dashboard data.
        GET /api/dashboard/instructors/<external_id>/
      parameters:
      - in: path
        name: external_id
        schema:
          type: string
        required: true
      - in: query
        name: programme_type_code
        schema:
          type: string
        description: Programme type code, for example UG (required)
        required: true
      - in: query
        name: semester
        schema:
          type: string
        description: Semester, for example First Semester (required)
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: Academic session, for example 2025/2026 (required)
        required: true
      tags:
      - Staff - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Instructor Detail Dashboard summary data
  /api/dashboard/students/:
    get:
      operationId: get_student_dashboard
      description: Returns a summary of the student's dashboard including courses,
        pending quizzes, and upcoming assignments.
      summary: Student Dashboard Summary
      parameters:
      - in: query
        name: semester
        schema:
          type: string
        description: Semester name, for example First Semester (required)
        required: true
      - in: query
        name: session
        schema:
          type: string
        description: Session name, for example 2025/2026 (required)
        required: true
      tags:
      - Student - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Dashboard summary data
  /api/dashboard/students/{external_id}/:
    get:
      operationId: get_student_detail_dashboard
      description: |-
        Endpoint for retrieving a specific student's dashboard data.
        GET /api/dashboard/students/<external_id>/
      parameters:
      - in: path
        name: external_id
        schema:
          type: string
        required: true
      tags:
      - Staff - Dashboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Student Detail Dashboard summary data
  /api/department/all:
    get:
      operationId: api_department_all_list
      parameters:
      - name: ordering
        required: false
