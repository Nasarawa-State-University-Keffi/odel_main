        * `in_progress` - In Progress
        * `finished` - Finished
        * `abandoned` - Abandoned
    StorageBackendEnum:
      enum:
      - local
      - s3
      - cloudinary
      - youtube
      type: string
      description: |-
        * `local` - local
        * `s3` - s3
        * `cloudinary` - cloudinary
        * `youtube` - youtube
    StorageSettings:
      type: object
      description: |-
        Serializer for managing storage backend settings.

        NOTE: Credentials are loaded from environment variables (.env file).
        This serializer only manages which backend is active.
      properties:
        id:
          type: integer
          readOnly: true
        backend:
          allOf:
          - $ref: '#/components/schemas/StorageSettingsBackendEnum'
          description: |-
            Active storage backend. Credentials are loaded from environment variables.

            * `local` - Local Filesystem
            * `s3` - Amazon S3
            * `cloudinary` - Cloudinary
            * `youtube` - YouTube
        is_active:
          type: boolean
          description: Only one configuration can be active.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    StorageSettingsBackendEnum:
      enum:
      - local
      - s3
      - cloudinary
      - youtube
      type: string
      description: |-
        * `local` - Local Filesystem
        * `s3` - Amazon S3
        * `cloudinary` - Cloudinary
        * `youtube` - YouTube
    StorageSettingsRequest:
      type: object
      description: |-
        Serializer for managing storage backend settings.

        NOTE: Credentials are loaded from environment variables (.env file).
        This serializer only manages which backend is active.
      properties:
        backend:
          allOf:
          - $ref: '#/components/schemas/StorageSettingsBackendEnum'
          description: |-
            Active storage backend. Credentials are loaded from environment variables.

            * `local` - Local Filesystem
            * `s3` - Amazon S3
            * `cloudinary` - Cloudinary
            * `youtube` - YouTube
        is_active:
          type: boolean
          description: Only one configuration can be active.
    SubmitAssignmentRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: Confirm submission
        session:
          type: string
          minLength: 1
          maxLength: 50
        semester:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - confirm
      - semester
      - session
    SubmitResponseRequest:
      type: object
      description: Request serializer for submitting a question response
      properties:
        question_id:
          type: string
          format: uuid
        response: {}
      required:
      - question_id
      - response
    TestEmailRequest:
      type: object
      properties:
        recipient:
          type: string
          format: email
          minLength: 1
        subject:
          type: string
          minLength: 1
          default: LMS email delivery test
          maxLength: 255
        message:
          type: string
          minLength: 1
          default: This is a test notification from the LMS.
        html_message:
          type: string
          nullable: true
      required:
      - recipient
    TestEmailSuccess:
      type: object
      properties:
        success:
          type: boolean
          readOnly: true
        detail:
          type: string
          readOnly: true
        backend:
          allOf:
          - $ref: '#/components/schemas/Backend048Enum'
          readOnly: true
        recipient:
          type: string
          format: email
          readOnly: true
      required:
      - backend
      - detail
      - recipient
      - success
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
          description: Number of unread in-app notifications.
      required:
      - unread_count
    YouTubeVideoRequest:
      type: object
      description: |-
        Serializer for registering YouTube videos as course content.
        Accepts either course external_id (e.g., 'CS101') or UUID.
      properties:
        video_url:
          type: string
          minLength: 1
          maxLength: 512
        course_id:
          type: string
          minLength: 1
          description: Course external_id (e.g., 'CS101') or UUID
        title:
          type: string
          minLength: 1
          maxLength: 512
        description:
          type: string
      required:
      - course_id
      - title
      - video_url
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/token/ endpoint
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Session cookie from Django admin login
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
