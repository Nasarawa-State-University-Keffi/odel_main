openapi: 3.0.3
info:
  title: LMS Service API
  version: 1.0.0
  description: Learning Management System with classroom management, assessment tools,
    and student portal synchronization
paths:
  /api/auth/login:
    get:
      operationId: api_auth_login_retrieve
      tags:
      - Global - Authentication
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/login/:
    get:
      operationId: api_auth_login_retrieve_2
      tags:
      - Global - Authentication
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/logout:
    post:
      operationId: api_auth_logout_create
      tags:
      - Global - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create_2
      tags:
      - Global - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me:
    get:
      operationId: api_auth_me_retrieve
      description: Returns details of the currently authenticated user.
      tags:
      - Global - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve_2
      description: Returns details of the currently authenticated user.
      tags:
      - Global - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
          description: ''
  /api/auth/oidc/callback:
    get:
      operationId: api_auth_oidc_callback_retrieve
      tags:
      - Global - Authentication
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/auth/oidc/callback/:
    get:
      operationId: api_auth_oidc_callback_retrieve_2
      tags:
      - Global - Authentication
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/content/:
    get:
      operationId: api_content_list
      description: List learning content with filtering.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Global - Content
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLearningContentList'
          description: ''
  /api/content/{id}/:
    get:
      operationId: api_content_retrieve
      description: Retrieve or delete specific learning content.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Global - Content
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningContent'
          description: ''
    delete:
      operationId: api_content_destroy
      description: Retrieve or delete specific learning content.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Global - Content
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/content/{id}/log-access/:
    post:
      operationId: api_content_log_access_create
      description: Log content access.
      summary: Log content access
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Global - Content
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - view
                  - download
              required:
              - action
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Access logged successfully
  /api/content/add-youtube/:
    post:
      operationId: api_content_add_youtube_create
      description: Add a reference to an existing YouTube video (no file upload).
      summary: Add YouTube video reference
      tags:
      - Staff - Content Upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YouTubeVideoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/YouTubeVideoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/YouTubeVideoRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningContent'
          description: ''
  /api/content/content-logs/:
    get:
      operationId: api_content_content_logs_list
      description: List content access logs.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Admin - Content Logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContentAccessLogList'
          description: ''
  /api/content/course/{course_id}/:
    get:
      operationId: api_content_course_list
      description: |-
        List content for a specific course (filtered by UUID or external_id).
        Used by students to view course materials.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Student - Content
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLearningContentList'
          description: ''
  /api/content/statistics/:
    get:
      operationId: api_content_statistics_retrieve
      description: Get content statistics.
      summary: Get content statistics
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
        description: Filter statistics by course ID
      tags:
      - Staff - Content Stats
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentStatistics'
          description: ''
  /api/content/storage-settings/:
