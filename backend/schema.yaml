components:
  schemas:
    AcademicSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
      required:
      - id
      - name
    AcademicSessionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - name
    ActionEnum:
      enum:
      - view
      - download
      type: string
      description: |-
        * `view` - View
        * `download` - Download
    AssignmentContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        content_type:
          allOf:
          - $ref: '#/components/schemas/AssignmentContentContentTypeEnum'
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - title
      - url
    AssignmentContentContentTypeEnum:
      enum:
      - instruction
      - resource
      - example
      type: string
      description: |-
        * `instruction` - Instruction
        * `resource` - Resource
        * `example` - Example
    AssignmentRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/CourseCache'
          readOnly: true
        content_files:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentContent'
          readOnly: true
        title:
          type: string
          maxLength: 512
        description:
          type: string
        open_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Null means unlimited attempts
        allow_late_submission:
          type: boolean
        is_published:
          type: boolean
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Maximum marks for this assignment
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
      required:
      - content_files
      - course
      - created_at
      - created_by
      - due_at
      - id
      - open_at
      - title
    AssignmentSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        assignment:
          type: string
          format: uuid
          readOnly: true
        student_external_id:
          type: string
          readOnly: true
        attempt_number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentSubmissionStatusEnum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        graded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Final score for this submission attempt
        created_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentSubmissionFile'
          readOnly: true
      required:
      - assignment
      - attempt_number
      - created_at
      - files
      - graded_at
      - id
      - marks
      - status
      - student_external_id
      - submitted_at
    AssignmentSubmissionFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        storage_path:
          type: string
          maxLength: 512
        original_filename:
          type: string
          maxLength: 512
        file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        mime_type:
          type: string
          maxLength: 100
        storage_backend:
          type: string
          maxLength: 20
        content_hash:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        submission:
          type: string
          format: uuid
      required:
      - created_at
      - file_size
      - id
      - mime_type
      - original_filename
      - storage_path
      - submission
      - url
    AssignmentSubmissionStatusEnum:
      enum:
      - draft
      - submitted
      - graded
      - reopened
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `graded` - Graded
        * `reopened` - Reopened
    AssignmentWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 512
        description:
          type: string
        open_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Null means unlimited attempts
        allow_late_submission:
          type: boolean
        is_published:
          type: boolean
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Maximum marks for this assignment
        course:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - course
      - due_at
      - open_at
      - title
    AssignmentWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        description:
          type: string
        open_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        close_at:
          type: string
          format: date-time
          nullable: true
        max_attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Null means unlimited attempts
        allow_late_submission:
          type: boolean
        is_published:
          type: boolean
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Maximum marks for this assignment
        course:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - course
      - due_at
      - open_at
      - title
    Backend048Enum:
      enum:
      - smtp
      - resend
      - brevo
      - console
      type: string
      description: |-
        * `smtp` - SMTP (Standard)
        * `resend` - Resend API
        * `brevo` - Brevo (Sendinblue) API
        * `console` - Console (Development)
    BackendChoiceEnum:
      enum:
      - smtp
      - resend
      - brevo
      - console
      type: string
      description: |-
        * `smtp` - SMTP (Standard)
        * `resend` - Resend API
        * `brevo` - Brevo (Sendinblue) API
        * `console` - Console (Development)
    BlankEnum:
      enum:
      - ''
    ContentAccessLog:
      type: object
      description: Serializer for content access tracking.
      properties:
        id:
